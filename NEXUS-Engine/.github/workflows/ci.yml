name: CI

on:
  push: { branches: ["**"] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - name: Установка
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Диагностика окружения
        run: python -m nexus.cli doctor
      - name: Тесты
        run: python -m pytest -q
      - name: Сквозной прогон (nano)
        run: python -m nexus.cli quickstart --scale nano --workdir artifacts-ci || true
      - name: Приёмочные тесты модели
        run: |
          python -m nexus.cli eval --model-name core --ref latest \
            --registry artifacts-ci/registry --source flywheel:artifacts-ci/flywheel \
            --json artifacts-ci/eval.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-ci-report
          path: artifacts-ci/*.json
          if-no-files-found: ignore
