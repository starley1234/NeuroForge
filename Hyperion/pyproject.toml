[project]
name = "hyperion"
version = "0.1.0"
description = "Hyperion - гибридная мультимодальная LLM архитектура нового поколения"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "einops>=0.8.0",
    "numpy>=1.24.0",
    "tqdm>=4.65.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hyperion*"]