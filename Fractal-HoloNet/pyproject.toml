[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fractal-holonet"
version = "2.3.0"
description = "Fractal-HoloNet / ELAST-HOLO: linear-recurrent multimodal architecture with elastic time, BPE tokenization, model registry, knowledge distillation and autonomous self-training"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "numpy>=1.24.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "onnx>=1.16.0",
    "onnxruntime>=1.17.0",
    "matplotlib>=3.8.0",
    "tokenizers>=0.15.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools.packages.find]
include = ["fractal_holonet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cache-clear"
