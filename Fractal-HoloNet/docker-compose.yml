version: '3.8'

services:
  fractal-holonet-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fractal-holonet-inference
    ports:
      - "8000:8000"
    environment:
      - TEXT_MODEL_DIR=/app/checkpoints/fractal_holonet_base
      - SIGNAL_MODEL_DIR=/app/checkpoints/fractal_holonet_multimodal
      - WORKERS=2
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
