[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroscad"
version = "0.1.0"
description = "Typed CAD intermediate representation and deterministic OpenSCAD compiler"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "NeuroForge contributors"}]
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.28", "pydantic>=2.6"]
validation = ["trimesh>=4.0", "numpy>=1.24"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
neuroscad = "neuroscad.cli:main"

[tool.setuptools.packages.find]
include = ["neuroscad*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
